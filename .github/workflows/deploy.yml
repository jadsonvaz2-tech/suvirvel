name: Validar protótipo Legado do Vale 3D

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Validar arquivos do jogo
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sintaxe JavaScript
        run: node --check src/main.js
      - name: Verificar arquivos essenciais
        run: |
          test -s index.html
          test -s style.css
          test -s src/main.js
